<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Properties | RentEase Uganda</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body data-page="props">
<header id="site-header"></header>
<main>
<section class="page-head"><div class="container"><h1>Browse Properties</h1><p>Sample listings in Kampala and nearby districts. Prices are examples, not live availability.</p></div></section>
<section class="container py-4"><form class="filters" id="filters"><input id="fq" class="form-control" placeholder="Search area or title" aria-label="Search"><select id="fcat" class="form-select" aria-label="Category"><option value="">All categories</option></select><select id="fbeds" class="form-select" aria-label="Bedrooms"><option value="">Any bedrooms</option><option value="0">Single room</option><option value="1">1</option><option value="2">2</option><option value="3">3+</option></select><input id="fmax" type="number" min="0" class="form-control" placeholder="Max price (UGX)" aria-label="Max price"><button type="button" id="freset" class="btn btn-outline-navy">Reset</button></form><p id="count" class="text-muted mt-3"></p><div class="row g-4" id="grid"></div><div id="empty" class="alert alert-warning d-none">No properties match your filters. Try resetting them.</div></section>
</main>
<footer id="site-footer"></footer>
<div id="modal-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body></html>
